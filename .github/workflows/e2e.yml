name: E2E Production

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - "backend/**"
      - "api/**"
      - "e2e/**"
      - ".github/workflows/e2e.yml"
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: concurso-tutor-e2e-production
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_BASE_URL: https://concurso-tutor.vercel.app
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Vercel production deployment
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 40); do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status" --jq '[.statuses[] | select(.context == "Vercel")][0].state // "pending"')
            echo "Vercel status: ${state} (attempt ${attempt}/40)"
            if [ "${state}" = "success" ]; then
              exit 0
            fi
            if [ "${state}" = "failure" ] || [ "${state}" = "error" ]; then
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for Vercel production deployment"
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: e2e/package.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm install

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run four-profile E2E suite
        working-directory: e2e
        run: npm test

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-production-${{ github.run_id }}
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 14
