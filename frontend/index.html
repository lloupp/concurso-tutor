<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Concurso Tutor</title><link rel="stylesheet" href="/styles.css?v=2"/></head><body><header id="topbar" hidden><span class="brand"><span class="brand-mark">✓</span><span class="brand-name">Concurso Tutor</span></span><span class="userinfo"><span id="userinfo"></span></span><button id="logout" class="btn-ghost">Sair</button></header><main><section id="login" class="examsheet"><p class="eyebrow">Concurso público · acesso do candidato</p><h1>Concurso Tutor</h1><p class="lead">Escolha sua trilha uma única vez. O plano cobre todo o conteúdo.</p><label class="field">Usuário<input id="username" autocomplete="username"/></label><label class="field">Senha<input id="password" type="password" autocomplete="current-password"/></label><button id="btnLogin" class="btn-stamp">Entrar</button><div class="cadastro-box"><p class="eyebrow">Primeiro acesso</p><label class="field">Nome completo<input id="cadNome" autocomplete="name"/></label><label class="field">Novo usuário<input id="cadUsuario" autocomplete="username"/></label><label class="field">Nova senha<input id="cadSenha" type="password" autocomplete="new-password"/></label><label class="field">Sua trilha<select id="cadTrilha" class="perfil-select"></select></label><label class="field">Tempo diário<select id="cadTempo" class="perfil-select"><option value="20">20 minutos</option><option value="30">30 minutos</option><option value="45">45 minutos</option><option value="60" selected>60 minutos</option><option value="90">90 minutos</option></select></label><button id="btnCadastro" class="btn-ghost" type="button">Criar perfil</button><p id="cadastroMsg" class="hint"></p></div><p id="loginErr" class="err"></p></section><div id="app" hidden><nav class="tabs"><button data-tab="hoje" class="active">Bloco do dia</button><button data-tab="progresso">Boletim</button><button data-tab="plano">Plano de estudo</button></nav><section id="tab-hoje" class="tabpanel"><div id="blocoInfo"></div><div id="bankNotice" hidden></div><form id="formBloco"></form><div id="resultado"></div></section><section id="tab-progresso" class="tabpanel" hidden><div id="cobertura"></div><div id="dashboardCards" class="dashboard-cards"></div><p class="eyebrow">Domínio por tópico</p><div id="heatmap"></div></section><section id="tab-plano" class="tabpanel" hidden><p class="eyebrow">Próximos tópicos · revisão espaçada e cobertura</p><div id="planoLista"></div></section></div></main><script src="/app.js?v=4"></script><script src="/feedback-inline.js?v=1"></script></body></html>
