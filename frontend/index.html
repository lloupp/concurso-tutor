<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Concurso Tutor</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header id="topbar" hidden>
  <span class="logo">📚 Concurso Tutor</span>
  <span id="userinfo"></span>
  <button id="logout">Sair</button>
</header>

<main>
  <!-- LOGIN -->
  <section id="login" class="card center">
    <h1>Entrar</h1>
    <input id="username" placeholder="usuário" autocomplete="username" />
    <input id="password" type="password" placeholder="senha" autocomplete="current-password" />
    <button id="btnLogin">Entrar</button>
    <p class="hint">Demo: admin/admin123 · aluno_pf/123456 · aluno_enf/123456</p>
    <p id="loginErr" class="err"></p>
  </section>

  <!-- APP -->
  <div id="app" hidden>
    <nav class="tabs">
      <button data-tab="hoje" class="active">📝 Bloco de hoje</button>
      <button data-tab="progresso">📊 Progresso</button>
      <button data-tab="plano">🗺️ Plano</button>
    </nav>

    <section id="tab-hoje" class="tabpanel">
      <div id="blocoInfo"></div>
      <form id="formBloco"></form>
      <div id="resultado"></div>
    </section>

    <section id="tab-progresso" class="tabpanel" hidden>
      <div id="cobertura"></div>
      <h3>Dominância por tópico</h3>
      <div id="heatmap" class="heatmap"></div>
    </section>

    <section id="tab-plano" class="tabpanel" hidden>
      <h3>Próximos tópicos (revisão espaçada + cobertura)</h3>
      <div id="planoLista"></div>
    </section>
  </div>
</main>

<script src="/app.js"></script>
</body>
</html>
