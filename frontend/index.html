<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Concurso Tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css?v=2" />
</head>
<body>
<header id="topbar" hidden>
  <span class="brand"><span class="brand-mark">✓</span><span class="brand-name">Concurso Tutor</span></span>
  <span id="userinfo" class="userinfo"></span>
  <button id="logout" class="btn-ghost">Sair</button>
</header>

<main>
  <!-- LOGIN -->
  <section id="login" class="examsheet">
    <p class="eyebrow">Concurso público · acesso do candidato</p>
    <h1>Concurso Tutor</h1>
    <p class="lead">Seu bloco de estudo diário, corrigido na hora.</p>
    <label class="field">Usuário
      <input id="username" autocomplete="username" />
    </label>
    <label class="field">Senha
      <input id="password" type="password" autocomplete="current-password" />
    </label>
    <button id="btnLogin" class="btn-stamp">Entrar</button>
    <p class="hint">Demo: admin/admin123 · aluno_pf/123456 · aluno_enf/123456 · aluno_pericia/123456</p>
    <p id="loginErr" class="err"></p>
  </section>

  <!-- APP -->
  <div id="app" hidden>
    <nav class="tabs">
      <button data-tab="hoje" class="active">Bloco do dia</button>
      <button data-tab="progresso">Boletim</button>
      <button data-tab="plano">Plano de estudo</button>
    </nav>

    <section id="tab-hoje" class="tabpanel">
      <div id="blocoInfo"></div>
      <form id="formBloco"></form>
      <div id="resultado"></div>
    </section>

    <section id="tab-progresso" class="tabpanel" hidden>
      <div id="cobertura"></div>
      <p class="eyebrow">Domínio por tópico</p>
      <div id="heatmap"></div>
    </section>

    <section id="tab-plano" class="tabpanel" hidden>
      <p class="eyebrow">Próximos tópicos · revisão espaçada e cobertura</p>
      <div id="planoLista"></div>
    </section>
  </div>
</main>

<script src="/app.js?v=2"></script>
</body>
</html>
